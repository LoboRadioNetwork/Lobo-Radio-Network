<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustang Dallas | Lobo Radio Network</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f0a07;
      --card-bg: #1c140e;
      --accent-gold: #e5a93c;
      --accent-red: #b83227;
      --text-main: #f3ece4;
      --text-muted: #a69888;
      --border-color: #38281d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: linear-gradient(180deg, #261a12 0%, var(--bg-dark) 100%);
      border-bottom: 2px solid var(--accent-gold);
      padding: 20px;
      text-align: center;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .station-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-gold);
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .network-subtitle {
      font-size: 0.9rem;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .player-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      text-align: center;
    }

    .embed-container {
      margin-top: 15px;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .embed-container iframe {
      width: 100%;
      height: 360px;
      border: none;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #2b1d14 0%, #1c130d 100%);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 14px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: var(--accent-gold);
      color: #000;
      transform: translateY(-2px);
    }

    .patreon-btn {
      border-color: #ff424d;
      color: #ff424d;
    }

    .patreon-btn:hover {
      background: #ff424d;
      color: #fff;
    }

    footer {
      margin-top: auto;
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1 class="station-title"><i class="fa-solid fa-radio"></i> MUSTANG DALLAS</h1>
      <div class="network-subtitle">Part of the Lobo Radio Network</div>
    </div>
  </header>

  <main>
    <section class="player-card">
      <h2 style="color: var(--text-main); margin-bottom: 10px;">Texas Country & Red Dirt 24/7</h2>
      <p style="color: var(--text-muted);">Broadcasting Live via Live365</p>

      <div class="embed-container">
        <iframe src="https://live365.com/embed/player.html?station=a87622" title="Mustang Dallas Player"></iframe>
      </div>
    </section>

    <div class="links-grid">
      <a href="https://www.loboradio.com" target="_blank" class="action-btn">
        <i class="fa-solid fa-globe"></i> Visit Lobo Radio
      </a>
      <a href="https://patreon.com/cw/MustangDallas" target="_blank" class="action-btn patreon-btn">
        <i class="fa-brands fa-patreon"></i> Support on Patreon
      </a>
    </div>
  </main>

  <footer>
    &copy; 2026 Lobo Radio Network. Mustang Dallas is powered by Live365.
  </footer>

</body>
</html>
